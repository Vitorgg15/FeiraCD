<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ranking • Empresário por 5 Minutos</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#173c4d,#071521 65%);color:#f8fafc;font-family:system-ui,Segoe UI,sans-serif;padding:clamp(16px,3vw,42px)}
header{display:flex;justify-content:space-between;align-items:end;gap:20px;max-width:1400px;margin:0 auto 28px}h1{font-size:clamp(30px,5vw,58px);margin:4px 0}.eyebrow{color:#fbbf24;font-weight:900;letter-spacing:.16em;text-transform:uppercase;font-size:12px}.sub{color:#cbd5e1}.live{color:#86efac;font-size:13px;font-weight:800}
main{max-width:1400px;margin:auto;background:#102638;border:1px solid #315166;border-radius:22px;overflow:hidden;box-shadow:0 25px 80px #0005}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:clamp(13px,2vw,24px);border-bottom:1px solid #284457}th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#93c5d6;background:#0b1c2a}td{font-size:clamp(15px,2vw,25px)}td:first-child{font-weight:900;color:#fbbf24;width:90px}td:last-child,th:last-child{text-align:right;font-variant-numeric:tabular-nums}.user{font-weight:800}.title{color:#cbd5e1}.empty{text-align:center;padding:60px 20px;color:#cbd5e1;font-size:20px}.foot{max-width:1400px;margin:18px auto;color:#94a3b8;font-size:13px;display:flex;justify-content:space-between}
@media(max-width:700px){header{display:block}th:nth-child(3),td:nth-child(3){display:none}td{font-size:15px}}
</style></head><body>
<header><div><div class="eyebrow">Feira de Profissões • Ciências de Dados</div><h1>🏆 Ranking oficial</h1><div class="sub">Empresário por 5 Minutos</div></div><div class="live">● ATUALIZAÇÃO AUTOMÁTICA</div></header>
<main><table><thead><tr><th>Posição</th><th>Participante</th><th>Título conquistado</th><th>Faturamento</th></tr></thead><tbody id="rankingRows"><tr><td colspan="4" class="empty">Carregando classificação...</td></tr></tbody></table></main>
<div class="foot"><span>Classificação por maior faturamento bruto acumulado.</span><span id="updated">Conectando...</span></div>
<script>
const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(v);
async function refresh(){
 try{
  const r=await fetch('/api/ranking',{cache:'no-store'});const d=await r.json();
  const body=document.getElementById('rankingRows');
  if(!d.ranking.length){body.innerHTML='<tr><td colspan="4" class="empty">Aguardando a primeira partida...</td></tr>';}
  else body.innerHTML=d.ranking.map((p,i)=>`<tr><td>${String(i+1).padStart(2,'0')}º</td><td class="user"></td><td class="title"></td><td></td></tr>`).join('');
  [...body.querySelectorAll('tr')].forEach((tr,i)=>{if(!d.ranking[i])return;tr.children[1].textContent=d.ranking[i].username;tr.children[2].textContent=d.ranking[i].title;tr.children[3].textContent=money(d.ranking[i].revenue);});
  document.getElementById('updated').textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR');
 }catch(e){document.getElementById('updated').textContent='Aguardando conexão com o servidor';}
}
refresh();setInterval(refresh,2500);
</script></body></html>
